name: bld-examples

on: [push, pull_request, workflow_dispatch]

jobs:
  run-bld-examples:
    strategy:
      matrix:
        java-version: [ 17, 21, 24 ]
        kotlin-version: [ 2.0.21, 2.1.21, 2.2.21, 2.3.21, 2.4.10 ]
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: ${{ matrix.java-version }}

      - name: Setup Kotlin ${{ matrix.kotlin-version }}
        uses: fwilhe2/setup-kotlin@main
        with:
          version: ${{ matrix.kotlin-version }}

      - name: Cache bld dependencies
        id: cache-bld
        uses: actions/cache@v6
        with:
          path: examples/lib
          key: ${{ runner.os }}-bld-java${{ matrix.java-version }}-kotlin{{ martrix.kotlin-version }}-examples-lib

      - name: Compile source
        working-directory: examples
        env:
          KOTLIN_VERSION: ${{ matrix.kotlin-version }}
        run: ./bld --auto-download-purge clean compile

      - name: Run tests
        working-directory: examples
        env:
          KOTLIN_VERSION: ${{ matrix.kotlin-version }}
        run: ./bld test
